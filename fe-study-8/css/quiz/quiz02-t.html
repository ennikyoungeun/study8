<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<style>
table, th, td {
border:1px solid black;
border-collapse: collapse;}

/*r의 몇번째자식
th { color: blue; }
tr:nth-of-type(2) { color: red; }
tr:nth-of-type(4) { color: red; }
tr:nth-of-type(6) { color: red; }
 */
/* 짝수번째 tr*/

tr:nth-of-type(even) { color: red; }

</style>

</head>
    <body>
        <table>
        <tr>
            <th>순번</th>
            <th>아이디</th>
            <th>이름</th>
        </tr>

        <tr>

            <td class="select-class">apple12</td>
            <td class="select-class">유재석</td>
        </tr>

        <tr>
            <td>2</td>
            <td>orange5</td>
            <td>강호동</td>
        </tr>

        <tr>
            <td class="select-class">3</td>
            <td class="select-class">freshwater</td>
            <td class="select-class">신동엽</td>
        </tr>

        <tr>
            <td>4</td>
            <td>takcard</td>
            <td>탁재훈</td>
        </tr>

        <tr>
            <td class="select-class">5</td>

</table>

</html>
