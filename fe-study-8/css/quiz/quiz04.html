<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
        margin: 0;
        }

        .navbar {
        background-color: lightgray;
        padding: 10px;
        }

        .main {
        background-color: white; 
        }

        .container {
        width: 500px;
        height:300px;
        border: 4px solid black;
        position: relative;
        background-color: white;
        }

        .box {
        width: 100px;
        height: 100px;
        position: absolute;
        color: black;
        font-weight: bold;
        }

        .a {
        background-color: red;
    
        position: relative;
        z-index: 1;
        }

        
        .b {
        background-color: green;
        width: 100px;
        height: 100px;
        top: 30px;
        left: 60px;
        z-index: 3;
        }

        .c {
        background-color: yellow;
        position: relative;
        left: 0;
        z-index: 2;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h3>배경색이 lightgry</h3>
        <h3>h3글자</h3>
    </div>

    <div class="main"></div>
    <div class="container">
        <div class="box a">A</div>
        <div class="box b">B</div>
        <div class="box c">C</div>
    </div>
    </div>

</body>

</html>
