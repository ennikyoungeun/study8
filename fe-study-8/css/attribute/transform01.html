<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /*
            transition :전환효과 (from->to)  -> 효과를 부여할 속성지정
            animaition : 여러 단계에 걸쳐서 전환효과+반복+재생정지 -> 효과를 부여할 속성들 지정
            
            transform : 자체적으로 전환효과를 주는 속성   
        */

        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            /* transfprm은 속성이라 나중꺼만 작동*/
            /* transform: translate(50px,150px); */
            /* transform: scale(3);  */
            /* transform: scale(1.5,2.5); */
            
            /* 변형효과의 기준점을 변경할때 */
            /* transform-origin: left top; */

            /* 기울이기 */
             /* transform: skew(30deg,45deg); */
            /* 회전하기 */
            transform: rotate(60deg);
            transform-origin: left top;
        }
    </style>
</head>
<body>
    
    <div class="box"></div>
    <div>next 다음에 나타나는 요소</div>
</body>
</html>
