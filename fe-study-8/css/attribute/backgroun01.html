<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 400px;
            height: 300px;
            border: 1px solid red;
        }

        .back {background-color: green;}

        .back-img {
            background-image: url(../../img/lex.jpg );
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .back-img2 {
            background-image: url(../../img/img002.jpg );
            background-repeat: no-repeat;
            /*background-size: cover;*/
            background-position: right top;
        }

        /*백그라운드 요소 속성
        no-repeat:반복없음
        repeat-x:가로방향 반복,repeat-y:세로방향 반복
        repeat:이미지 가로와세로 방향으로반복
        round: 이미지를 반복하되 이미지가 요소에 딱맞게 크기자동조절
        space: 이미지가 잘리지 않도록 반복
        */

        /*백그라운드 사이즈속성*/
        /* background-size : 속성
                            auto:이미지크기유지
                            cover:비율은 유지,크기를 확대나 축소해 요소에 꽉채움
                            contain: 이미지의 비율은 유지, 배경요소에 들어가도록 
                            크기를확대하거나축소, 가로나 세로중 한축이 채워지면 나머지는 반복해 채워보임
                            <*/
    </style>

</head>
<body>
    
    <div class="box back"></div>

    <div class="box back-img"></div>

    <div class="box back-img2"></div>

</body>
</html>
