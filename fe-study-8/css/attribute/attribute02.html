<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style> /* font 속성 */
        .font-attr1 {
            font-family: 'Times New Roman', serif;
            font size: 20px;
            font-variant: small-caps; 
            /* 대문자만 작은 글씨로 표기 */
            color: darkblue;

        }

        .font-attr2 {
            /* font-weight : 글씨 굵기 , bold=700*/
            font-weight: bold;
            font-style: italic; /* oblique*/
        }
    </style>
</head>
<body>
    
    <p>기본 텍스트</p>

    <p class="font-attr1"> Font attr1</p>
    <p class="font-attr2"> Font attr2 글씨속성</p>

</body>
</html>
