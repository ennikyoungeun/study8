<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .box {
            width: 200px;
            height: 200px;
        }

        .red-box {
            background-color: red;

            position: relative;
            left: 100px;
            z-index: 100; /*z-index 값이 크면 앞으로 나옴 */
        }

        .green-box {
            background-color: green;
            position: absolute; /*부모의 시작점*/
            left:50px;
            top: 50px;
            z-index: 5;
        }

        .blue-box {
            background-color: blue;
            position: relative;/*자기위치*/
            left:50px;
            top: 50px;
        }

    </style>

</head>
<body>
    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>
</body>
</html>
