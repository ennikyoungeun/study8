<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* 색상 키워드 표기*/
        .cls1 { color: blueviolet; }

        /* rgb 색상 표기 */

        .cls2 { color: rgb(49, 116, 184) }

        /* RGBA : RGB + Alpha(투명도) */
        .cls3 { color: rgb(49, 116, 184, 0.5) }

        /* 16진수 색상 표기 00~ff */
        /* RGB 0 255 0 */
        /* HEX 00 ff 00 */
        .cls4 { color: #e0a236; }


    </style>
</head>
<body>
    
    <h1 class="cls1">color check cls1</h1>
    
    <h1 class="cls2">color check cls2</h1>
    
    <h1 class="cls3">color check cls3</h1>
    
    <h1 class="cls4">color check cls4</h1>

    1
</body>
</html>
