<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form> <!--폼영역-->

        <input type="text" >
        <input type="text" value="초기값111">
        <!--input태그는 value속성으로 초기값을 지정할 수 있다.-->
<br>

        <input type="password"><br>
        <input type="tel"><br>
        <input type="url"><br> 
        <input type="email"><br>
        <input type="checkbox"><input type="checkbox"><input type="checkbox"><br>
        <input type="radio" name="size"><input type="radio" name="size"><input type="radio" name="size"><br>
        <!--radio버튼은 name속성을 통해 하나의 그룹으로 묶을 수 있다.
        name속성이 같은 radio버튼은 하나만 선택할 수 있다.
        name속성이 다른 radio버튼은 서로 독립적으로 선택된다.-->
    
        <input type="button" value="인풋버튼"> <!--value속성으로 버튼에 표시될 텍스트-->
        <input type="file"><br>
        <input type="date"><br>
        <input type="color"><br>
        <input type="submit"><br> <!--submit버튼은 폼을 제출할 때 사용된다.-->
        <input type="reset"><br>
        <input type="hidden"><br>
        <!--hidden버튼은 사용자에게 보이지 않지만 
        폼과 함께 제출되는 데이터를 저장할 때 사용된다.-->

    </form>
</body>
</html>
