    <!--
        a태그 : 어떤 링크/대상 으로 이동하는 태그
        
        href 속성 :이동할 경로
        target 속성 : 어떻게 띄울건지
            blank : 새창
            _self : 현재 창
            -->

    <a href="https://www.naver.com" target="_self" title="네이버로 이동">네이버이동 </a>
    <br>
    <a href="https://www.google.com" target="_blank" title="구글로 이동">구글이동</a>
    <br>
        <!-- title 속성 : 마우스를 올렸을 때 표시될 텍스트 -->

    <a href="./tag03.html" target="_self" >tag03.html로이동</a>
    <a href="../start.html" target="_self" >start.html로이동</a>
    <!-- ./ : 현재 폴더(경로)를 의미
        ../ : 상위 폴더(경로)를 의미
    -->
    <a href="../quiz/quiz01.html" target="_self" >quiz01.html로이동</a>
    <!-- ../quiz/quiz01.html : 
     상위 폴더의 quiz 폴더 내의 quiz01.html 파일로 이동 -->
