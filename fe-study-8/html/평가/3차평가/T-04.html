<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex;
                justify-content: center; align-items: center; height: 100vh; 
                background-color: #f5f5f5; margin: 0; }
        .signup-container { background: #ffffff; padding: 30px; border-radius: 8px; 
                            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        h2 { margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .required { color: red; margin-left: 3px; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 10px; 
                                border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .notice { font-size: 12px; color: #666; margin-top: 15px; text-align: right; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; 
                font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="signup-container">
    <h2>회원가입</h2>
    <form>
        <div class="form-group">
            <label for="username">아이디<span class="required">*</span></label>
            <input type="text" id="username" placeholder="아이디를 입력하세요" required>
        </div>
        
        <div class="form-group">
            <label for="password">비밀번호<span class="required">*</span></label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력하세요">
        </div>
        
        <p class="notice"><span class="required">*</span> 표시가 있는 항목은 필수 입력 항목입니다.</p>
        
        <button type="submit">가입하기</button>
    </form>
</div>
</body>
</html>
