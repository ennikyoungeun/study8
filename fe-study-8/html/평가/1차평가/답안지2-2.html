<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #243238;
            width: 380px;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .tab-group {
            display: flex;
            margin-bottom: 30px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .tab.active {
            color: #ffffff;
            background-color: #1ab188;
        }
        
        .tab.inactive {
            color: #718188;
            background-color: transparent;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            font-weight: 300;
            margin: 0 0 30px 0;
            font-size: 24px;
        }

        .input-field {
            margin-bottom: 20px;
        }
        .input-field input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #718188;
            color: #ffffff;
            font-size: 16px;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        .input-field input::placeholder {
            color: #718188;
        }
        .input-field input:focus {
            border-color: #1ab188;
        }

        .submit-btn {
            width: 100%;
            background-color: #1ab188;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #159b76;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="tab-group">
            <a href="#" class="tab active">Sign Up</a>
            <a href="답안지2-1.html" class="tab inactive">Log in</a>
        </div>

        <h1>Sign Up for Free</h1>

        <form>
            <div class="input-field">
                <input type="email" placeholder="Email Address *" required>
            </div>
            <div class="input-field">
                <input type="password" placeholder="Set A Password *" required>
            </div>
            <div class="input-field">
                <input type="password" placeholder="Confirm A Password *" required>
            </div>
            <button type="submit" class="submit-btn">GET STARTED</button>
        </form>
    </div>

</body>
</html>
