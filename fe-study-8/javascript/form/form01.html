<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>form01</h1>
    
    <form id="form_id" action="" method="">
        <label>아이디 : <input type="text" id="input_id" placeholder="아이디 입력하세요"></label>
        <br><br>
        <label>비번 : <input type="password" id="input_pw" ></label>

        <button type="submit" id="btn_submit">로그인 버튼(submit)</button>
        <button type="button" id="btn_normal">그냥 버튼</button>

        <br><br>
        <button type="button" id="btn_extra">extra버튼</button>
    </form>


    <script>

        //id= "chb_option"

        const input_id = document.getElementById('input_id');
        const input_pw = document.getElementById('input_pw');

        const btn_submit = document.getElementById('btn_submit');
        const btn_normal = document.getElementById('btn_normal');

        const btn_extra = document.getElementById('btn_extra');

        btn_normal.addEventListener('click', ()=>{
            console.log (input_id.value);
            console.log (input_pw.value);

            input_id.value='valuevalue';
        })

        input_id.addEventListener('focus',()=>{
            console.log ('input_id요소에 focus 잡힘');
        })

        input_pw.addEventListener('focus',()=>{
            console.log ('input_pw요소에 focus 잡힘');
        })

        btn_extra.addEventListener('click',()=>{
            btn_normal.click();  //그냥 버튼애 클릭한 이벤틀를 발생시켜라
            input_pw.focus();      //해당요소로 포커싱해라

            //click()
            //focus()
            //submit()  focus submit 발생시켜라   (submit버튼 click())
        })

        input_id.addEventListener('keydown',(event)=>{
            console.log(event.key);
            console.log(input_id.value);

            if(event.key=='Enter'){
                //input 요소에서 엔터 입력시 ->submit 발생
                //이벤트 발생->기본처리 하는이벤트처리 방식
                
                event.preventDefault();//기본발생 이벤트 중지
                input_pw.focus();
            }
        })

        //input_pw.addEventListener('submit',()=>{})
        //submit 이벤트 발생 주체 -> form

        document.getElementById('form_id').addEventListener('submit',(event)=>{
            //실행코드
            console.log("폼 submit 이 발생함");
            event.preventDefault();//submit 진행중지

            //submit 이벤트 :form이 주체
            //              -> form 내부 데이터 정리(검증, 수집)-> 다른페이지or서버경로로 전송(페이지 이동)
            //              -> action 페이지 정보 없으면 , 현재경로(페이지 새로 고침)
            // form action="속성값" 요청하는 경로
            //                 ""->현재경로


            //submit 멈춤
            //검증-> 입력?제한?>통과되면 submit 진행
            if( input_id.value.trim()==''){
                alert('아이디 필수 입력입니다.');
                input_id.value = input_id.value.trim();
                //input_id.value='';
                input_id.focus();
                return; //함수종료
            }

            //제한 비밀번호를 8자리 이상 입력
            if(input_pw.value.trim()==''){
                alert('비밀번호를 입력하세요!');
                input_pw.focus();
                return;
            }

            if(input_pw.value.trim().length<8){
                alert('비밀번호 8자리 이상입력하세요'); //로그인 화면이 아니라 회원가입 쪽에서 제한 하거나..
                return;
            }

            //검증..

            //다 통과! -> submit 발생
            document.getElementById('form_id').submit(); //submit 발생
        })
    </script>

</body>
</html>
