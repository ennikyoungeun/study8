<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>

<body>

<form id="loginform">
    <input type="text" id="loginId" placeholder="아이디"><br>
    <input type="password" id="loginPw" placeholder="비밀번호"><br>
    <button type="button" id="btnLogin" onclick="tryLogin()">로그인 시도</button><br>
</form>

<script>
//코드작성
const loginform =document.getElementById('loginform');
const loginId =document.getElementById('loginId');
const loginPw =document.getElementById('loginPw');


function tryLogin() {
    loginId.value="";
    loginPw.value="";
}

loginId.addEventListener('keydown',function(event){
    
    if(event.key==='Enter') {
        event.preventDefault();
        loginPw.focus();
    }
});

loginPw.addEventListener('keydown',function(event){

   if(event.key==='Enter') {
        event.preventDefault();
        tryLogin();
    }
});

</script>
</body>
</html>
