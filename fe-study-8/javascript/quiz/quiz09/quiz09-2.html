<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<style>
/* 필요시 작성 */
</style>
</head>
<body>
<div class="container">
<div id="main">
<p id="p1">p1 텍스트</p>
<p id="p2">p2 텍스트</p>
</div>
</div>
<button onclick="changeMain()">main 배경색 gray로 변경</button>
<button onclick="changeP1()">p1 글자색 red로 변경</button>
<button onclick="changeP2()">"p2 텍스트"를 "p2 글자" 로 변경</button>


<script>
/* 코드 작성 부분 */
function changeMain() {
    const mainDiv = document.getElementById('main');
    // 현재 배경색이 gray이면 비우고(해제), 아니면 gray로 지정
    if (mainDiv.style.backgroundColor === 'gray') {
        mainDiv.style.backgroundColor = '';
    } else {
        mainDiv.style.backgroundColor = 'gray';
    }
}

function changeP1() {
    const p1Text = document.getElementById('p1');
    // 현재 글자색이 red이면 비우고(해제), 아니면 red로 지정
    if (p1Text.style.color === 'red') {
        p1Text.style.color = '';
    } else {
        p1Text.style.color = 'red';
    }
}

const textList = ["p2 텍스트", "p2 하나", "p2 둘", "p2 셋", "p2 넷"];
let currentIndex = 0; // 현재 인덱스 위치 기억

function changeP2() {
    const p2Text = document.getElementById('p2');
    
    // 다음 인덱스로 이동 (배열 길이를 넘어가면 다시 0으로 순환)
    currentIndex = (currentIndex + 1) % textList.length;
    
    p2Text.textContent = textList[currentIndex];
}
</script>
</body>
</html>
